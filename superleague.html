/* Superleague v2.1 - first-prototype-style navigation, Excel content */
.workspace{flex:1;min-width:0;display:flex;align-items:stretch;width:100%;background:#e9edea}
.workspace>.workarea{margin:0;flex:1;min-width:0;width:auto;max-width:none;box-shadow:none}
.side{width:216px;min-width:216px;min-height:calc(100vh - 120px);background:linear-gradient(175deg,#133f34,#09271f);color:#e9fcf0;padding:20px 11px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;align-self:flex-start;height:100vh;max-height:100vh;overflow-y:auto;z-index:6}
.side-logo{display:flex;align-items:center;gap:10px;padding:6px 9px 24px;border-bottom:1px solid #32624e;margin-bottom:13px}
.side-logo-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#2a865b;border:1px solid #6ba57a;color:#fff;font-size:23px;font-weight:900}
.side-logo b{display:block;color:#f3fff6;font-size:16px;letter-spacing:-.5px}.side-logo small{display:block;margin-top:3px;font-size:9px;color:#a7cbbb;letter-spacing:1.3px}
.side-label{color:#94bcaa;font-size:10px;letter-spacing:1.7px;padding:8px 12px 9px;font-weight:700}
.side-links{display:flex;flex-direction:column;gap:5px}
.side-btn{width:100%;display:flex;align-items:center;gap:12px;min-height:43px;text-align:left;color:#c9e1d5;background:transparent;border:1px solid transparent;border-radius:8px;font-size:12px;font-weight:700;padding:8px 11px;transition:background .12s ease,color .12s ease}
.side-btn .sym{display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;font-size:19px;line-height:1}
.side-btn .navtxt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-btn:hover{background:#255b45;color:#fff}.side-btn.active{background:#ecf9ef;border-color:#9cc9af;color:#135c3b;box-shadow:inset 3px 0 0 #32aa6e}
.side-btn:focus-visible{outline:2px solid #a2e6bc;outline-offset:2px}
.side-bottom{margin-top:auto;border:1px solid #32614e;border-radius:8px;padding:12px 11px;background:#174937}
.side-bottom b{display:block;font-size:11px;color:#effff3}.side-bottom p{font-size:10px;color:#b4d3c2;margin:7px 0 0;line-height:1.7}
@media(max-width:790px){.side{width:64px;min-width:64px;padding:12px 6px;min-height:100vh}.side-logo{justify-content:center;padding:6px 0 16px}.side-logo-icon{width:36px;height:36px}.side-logo>div:last-child,.side-label,.side-btn .navtxt,.side-bottom{display:none}.side-links{gap:9px}.side-btn{justify-content:center;padding:8px 0;min-height:45px}.side-btn .sym{font-size:21px}.workspace>.workarea .worksheet{padding-left:14px}}

/* V4.3: morale-gated free agents; hidden internal development ceilings */
.recruit-req{display:inline-flex;gap:5px;align-items:center;white-space:nowrap;font-weight:750}
.recruit-req.ok{color:#17754a}.recruit-req.locked{color:#bd4942}
.recruit-summary{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
/* V3: morale / async friendlies / automatic league */
.morale-chip{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.morale-meter{width:105px;max-width:100%;height:9px;background:#dee8e1;border:1px solid #b5cec0;border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle}
.morale-fill{height:100%;display:block;background:#319a5b;transition:width .2s ease}
.morale-fill.low{background:#ca5447}.morale-fill.mid{background:#dea849}
.morale-big{font-size:25px;font-weight:850;letter-spacing:-1px}.morale-danger{color:#b43e3e}.morale-good{color:#167b4b}
.morale-track{height:14px;background:#e3ebe5;border-radius:9px;overflow:hidden;border:1px solid #bcd1c4;margin:8px 0}
.morale-track .morale-fill{height:100%}
.friend-status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 14px}
.friend-status>div{border:1px solid #ccd9cd;background:#f5faf6;padding:12px;border-radius:5px}
.friend-status strong{display:block;font-size:22px;margin-top:5px}
.challenge-pick{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.challenge-pick select{min-width:240px;flex:1}
.match-result-box{background:#f0f7f2;border:1px solid #a1cbb4;padding:14px;margin-bottom:12px;border-radius:5px}
.match-result-box .big-score{font-size:24px;font-weight:900;letter-spacing:.5px}
.league-live{border:1px solid #bfd3c4;background:#eef7f0;padding:10px 12px;border-radius:5px;margin:10px 0}
@media(max-width:680px){.friend-status{grid-template-columns:repeat(2,minmax(0,1fr))}.challenge-pick select{min-width:180px}}

/* V4: compact 14-day calendar */
.calendar{grid-template-columns:repeat(7,minmax(0,1fr));}
.calendar .day{min-height:112px;}
.calendar .details{font-size:10px;line-height:1.5;}
@media(max-width:1000px){.calendar{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:680px){.calendar{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* V4.5 contracts, discontent and strike */
.contract-flags{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.contract-status{font-size:10px;font-weight:800;padding:3px 6px;border:1px solid #c8ded0;background:#eef8f0;color:#1c7946;white-space:nowrap}
.contract-status.unhappy{background:#fff6dd;border-color:#e5c98d;color:#8d6415}
.contract-status.strike{background:#fff0ed;border-color:#efc0bb;color:#ae3d37}
.contract-remaining{color:#61786a;font-size:10px}
.contract-news{margin-bottom:6px;padding:8px 9px;border-bottom:1px solid #dce6dd}

/* V4.6: use explicit Korean labels instead of decorative glyph icons, including on mobile. */
.side-logo{padding-left:10px;padding-bottom:17px}
.side-logo b{font-size:17px}
.side-btn{gap:0;padding:10px 14px;font-size:13px;min-height:42px}
.side-btn .navtxt{display:inline!important;white-space:normal;text-overflow:clip;overflow:visible;line-height:1.35}
.titlebar .left{gap:0}
.toolstrip{height:auto;min-height:49px}
.toolgroup .btn{white-space:nowrap}
@media(max-width:790px){
 .side{width:143px;min-width:143px;padding:13px 7px}
 .side-logo{justify-content:flex-start;padding:6px 6px 14px}
 .side-logo>div:last-child,.side-label{display:block}
 .side-logo small{letter-spacing:0;font-size:8px}
 .side-btn{justify-content:flex-start;padding:9px 8px;min-height:40px;font-size:11px}
 .side-links{gap:4px}
 .workspace>.workarea .worksheet{padding-left:12px}
}
@media(max-width:400px){.side{width:125px;min-width:125px}.side-btn{font-size:10px;padding:9px 6px}}
.fast-forward-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fast-forward-actions .btn{white-space:nowrap}
.fast-run-status{font-weight:750;color:#176a40}

/* V4.7: restrained tactical broadcast over the Excel-inspired layout */
.v47-pitch{position:relative;width:100%;height:345px;border:2px solid #507861;border-radius:6px;overflow:hidden;background:repeating-linear-gradient(90deg,#e1efe5 0,#e1efe5 12.5%,#e9f4ec 12.5%,#e9f4ec 25%);box-shadow:inset 0 0 0 5px rgba(255,255,255,.35);margin:8px 0;isolation:isolate}
.v47-pitch:before{content:'';position:absolute;top:0;left:50%;height:100%;border-left:2px solid #fafdfa;opacity:.9;z-index:1}.v47-pitch:after{content:'';position:absolute;top:50%;left:50%;width:95px;height:95px;border:2px solid #fafdfa;border-radius:50%;transform:translate(-50%,-50%);z-index:1}
.v47-goal{position:absolute;top:35%;height:30%;width:7%;border:2px solid rgba(255,255,255,.88);z-index:1}.v47-goal.left{left:0;border-left:0}.v47-goal.right{right:0;border-right:0}

function saveRound(day,played){if(s.results[day])return;const pairs=weekRounds(s.season)[day],out=[];for(const[a,b]of pairs){let sc;if(played&&(a===s.selected||b===s.selected))sc=a===s.selected?[played.hs,played.as]:[played.as,played.hs];else sc=instant(a,b);out.push({a,b,sa:sc[0],sb:sc[1]})}s.results[day]=out}
function nextDay(){if(!hasSelected())return;if(active()){notice('진행 중인 경기를 먼저 완료해 주세요.');return}if(s.day<=4&&!s.results[s.day]){saveRound(s.day);notice('남은 리그 일정이 자동 집계되었습니다.')}if(s.day===4){const win=standings()[0];s.history.unshift({season:s.season,winner:win.name,pts:win.pts});s.history=s.history.slice(0,8)}if(s.day===6){if(s.preseason)s.preseason=false;else{s.season++;s.results={};}}s.day=(s.day+1)%7;s.ui.calendarDay=s.day;s.match=null;save();render()}
function chooseClub(id){if(hasSelected())return;const n=Number(id);if(!Number.isInteger(n)||n<0||n>=20)return;s.selected=n;s.lineup=defaultLineup(s.teams[n]);s.ui.rosterViewed=n;s.ui.calendarOpponent=(n+1)%20;save();render();notice(`${mine().name} 구단 운영을 시작합니다.`)}
function recruit(id){if(!marketOpen()){notice('주말(토·일)에만 영입할 수 있습니다.');return}if(active()){notice('경기 종료 후 선수 영입을 진행해 주세요.');return}let p=ply(id);if(!p||!p.legend)return;if(owners().has(id)){notice('이미 소속 구단이 있는 선수입니다.');return}if(mine().roster.length>=10){notice('선수단 최대 10명입니다.');return}if(s.points<price(p)){notice('데모 포인트가 부족합니다.');return}s.points-=price(p);mine().roster.push(id);save();render();notice(`${p.name} 영입 완료 · ${fmt(price(p))}P 차감`)}
function release(id){if(!marketOpen()||active()){notice('주말 및 경기 외 시간에만 방출 가능합니다.');return}const p=ply(id);if(!p||!mine().roster.includes(id))return;if(s.lineup.includes(id)){notice('선발 라인업에서 먼저 제외해 주세요.');return}if(counts(mine().roster)[p.pos]<=2){notice(`${p.pos}는 최소 2명을 유지해야 합니다.`);return}mine().roster=mine().roster.filter(x=>x!==id);const refund=Math.floor(price(p)*.55);s.points+=refund;save();render();notice(`${p.name} 방출 · ${fmt(refund)}P 반환`)}
function changeLineup(slot,id){if(active()){notice('경기 중 변경 불가 · 하프타임에서만 가능합니다.');return}const n=Number(slot),p=ply(id);if(!Number.isInteger(n)||n<0||n>=5||!p||p.pos!==ROLES[n]||!mine().roster.includes(id)||s.lineup.some((x,i)=>i!==n&&x===id))return;s.lineup[n]=id;if(s.match?.phase==='finished')s.match=null;save();render()}
function changeTactic(key,val){if(!TACTICS[key]||!(val in TACTICS[key]))return;if(active()&&s.match.phase!=='halftime'){notice('전술 변경은 하프타임에만 가능합니다.');return}const to=s.match?.phase==='halftime'?s.match.tactics:s.tactics;to[key]=val;save();render()}
const fkey=(season,day)=>`${season}-${day}`;
function selectedFriend(day=s.day){return s.friendlies[fkey(s.season,day)]}
function setCalendarDay(day){s.ui.calendarDay=clamp(Number(day)||0,0,6);save();render()}
function scheduleFriendly(){if(active()){notice('경기 종료 후 일정을 변경할 수 있습니다.');return}const d=Number(s.ui.calendarDay),opp=Number(s.ui.calendarOpponent);if(d<s.day){notice('이미 지난 날짜에는 친선경기를 등록할 수 없습니다.');return}if(!Number.isInteger(opp)||opp<0||opp>=20||opp===s.selected){notice('상대 구단을 선택해 주세요.');return}const current=selectedFriend(d);if(current?.status==='finished'){notice('이미 친선경기가 종료된 날짜입니다.');return}s.friendlies[fkey(s.season,d)]={opponent:opp,status:'scheduled'};save();render();notice(`${DAYS[d]}요일 ${s.teams[opp].name} 친선경기 등록 완료`)}
function cancelFriendly(){const d=Number(s.ui.calendarDay),k=fkey(s.season,d),f=s.friendlies[k];if(!f||f.status!=='scheduled'||d<s.day||active())return;delete s.friendlies[k];save();render();notice('친선 일정이 취소되었습니다.')}
function beginMatch(kind){if(active()){s.tab='match';render();notice('현재 경기부터 완료해 주세요.');return}if(!validLineup(s.lineup)){notice('선발 포지션(GK·DF·MF·FW·FW)을 점검해 주세요.');s.tab='squad';render();return}let opp;if(kind==='league'){opp=todaysOpponent();if(opp===null||s.day>4){notice('오늘 진행할 리그 경기가 없습니다.');return}}else{const f=selectedFriend();if(!f||f.status!=='scheduled'){notice('달력에서 오늘 친선경기를 먼저 등록해 주세요.');s.tab='calendar';render();return}opp=f.opponent;}if(opp===s.selected||!Number.isInteger(opp))return;
s.match={kind,opponent:opp,phase:'first',halfMin:0,hs:0,as:0,shotsHome:0,shotsAway:0,events:[],timeline:[],lineup:[...s.lineup],tactics:{...s.tactics},changed:0,subs:[],season:s.season,day:s.day};s.match.timeline=simulateHalf(s.match.lineup,defaultLineup(s.teams[opp]),s.match.tactics,defaultT(),1);s.ui.halfOut=0;s.ui.halfIn='';s.tab='match';save();render();runTimer()}
function halt(){if(timer){clearInterval(timer);timer=null}}
function runTimer(){halt();if(s.match&&!['first','second'].includes(s.match.phase))return;timer=setInterval(tick,270)}
function tick(){const m=s.match;if(!m||!['first','second'].includes(m.phase)){halt();return}const events=m.timeline[m.halfMin]||[];m.halfMin++;for(const e of events){m.events.push(e);if(m.events.length>80)m.events.shift();if(e.kind==='shot'||e.kind==='goal'){if(e.side==='home')m.shotsHome++;else m.shotsAway++}if(e.kind==='goal'){if(e.side==='home')m.hs++;else m.as++}}
if(m.halfMin>=20){halt();if(m.phase==='first'){m.phase='halftime';m.halfMin=20;notice('전반 종료 · 교체 및 전술 변경이 가능합니다.')}else{m.phase='finished';m.halfMin=20;s.lineup=[...m.lineup];s.tactics={...m.tactics};if(m.kind==='league')saveRound(m.day,m);else{const f=s.friendlies[fkey(m.season,m.day)];if(f){f.status='finished';f.score=[m.hs,m.as]}}notice('후반 종료 · 경기 결과가 저장되었습니다.')}save();render();return}save();renderTick()}
function startSecond(){let m=s.match;if(!m||m.phase!=='halftime')return;m.phase='second';m.halfMin=0;m.timeline=simulateHalf(m.lineup,defaultLineup(s.teams[m.opponent]),m.tactics,defaultT(),2);s.lineup=[...m.lineup];s.tactics={...m.tactics};save();render();runTimer()}
function halfSub(){let m=s.match;if(!m||m.phase!=='halftime'){notice('교체는 하프타임에서만 가능합니다.');return}let slot=Number(s.ui.halfOut),id=s.ui.halfIn,p=ply(id);if(!Number.isInteger(slot)||slot<0||slot>4||!p){notice('교체 대상 선수와 후보를 선택하세요.');return}if(p.pos!==ROLES[slot]||!mine().roster.includes(id)||m.lineup.includes(id)){notice('같은 포지션의 후보만 투입할 수 있습니다.');return}let old=m.lineup[slot];m.lineup[slot]=id;m.changed++;m.subs.push({out:old,in:id});s.ui.halfIn='';save();render();notice(`${ply(old).name} OUT → ${p.name} IN`)}
function switchTab(tab){if(!['dashboard','squad','market','calendar','friendly','league','match','clubs'].includes(tab))return;s.tab=tab;save();render()}

function squadPage(){
 const t=mine(),busy=active(),countsBy=counts(t.roster);

const V3_DEFENSE_LOSS_CAP=24;
function initializeV3(){
  if(!s.morale||typeof s.morale!=='object')s.morale={};
  for(const t of s.teams)if(!Number.isFinite(s.morale[t.id]))s.morale[t.id]=75;
  if(!s.pvp||typeof s.pvp!=='object')s.pvp={};
  if(!Array.isArray(s.pvp.history))s.pvp.history=[];
  s.pvp.attacks??={};s.pvp.cooldown??={};s.pvp.defDamage??={};
  s.auto??={};
  if(!Number.isFinite(s.auto.nextAt))s.auto.nextAt=Date.now()+V3_AUTO_MS;
  if(!Number.isInteger(s.auto.completed))s.auto.completed=0;
  if(!Array.isArray(s.auto.news))s.auto.news=[];
  if(!s.ui)s.ui={};
  if(!Number.isInteger(s.ui.friendlyTarget)||s.ui.friendlyTarget===s.selected)s.ui.friendlyTarget=((s.selected??0)+1)%20;
  save();
}
const teamMorale=id=>clamp(Number(s.morale?.[id]??75),0,100);
function moraleClass(val){return val<40?'low':val<65?'mid':''}
function moraleMeter(id){const m=teamMorale(id);return `<span class="morale-chip"><span class="morale-meter"><span class="morale-fill ${moraleClass(m)}" style="width:${m}%"></span></span><b>${m}</b></span>`}
function changeMorale(id,delta){if(!s.morale)s.morale={};const before=teamMorale(id);s.morale[id]=clamp(before+delta,0,100);return {before,after:s.morale[id],change:s.morale[id]-before}}
function moraleMultiplier(id){return .70+.004*teamMorale(id)}
function teamFromLineup(ids){if(!ids||!ids.length)return null;
  const first=ids[0];const t=s.teams.find(t=>t.roster.includes(first));return t?.id??null;
}
const oldEvaluate=evaluate;
evaluate=function(ids,t,half){const x=oldEvaluate(ids,t,half),id=teamFromLineup(ids);
  const mult=id===null?1:moraleMultiplier(id);
  return {att:x.att*mult,def:x.def*mult};
};
const oldSaveRound=saveRound;
saveRound=function(day,played){
  const existed=!!s.results[day];oldSaveRound(day,played);
  if(existed||!s.results[day])return;
  const report=[];
  for(const r of s.results[day]){
    if(r.sa>r.sb){changeMorale(r.a,+4);changeMorale(r.b,-7)}
    else if(r.sa<r.sb){changeMorale(r.a,-7);changeMorale(r.b,+4)}
    else{changeMorale(r.a,+1);changeMorale(r.b,+1)}
    report.push(`${s.teams[r.a].name} ${r.sa}:${r.sb} ${s.teams[r.b].name}`);
  }
  s.auto.completed++;
  s.auto.news.unshift({season:s.season,day,round:day+1,matches:report,stamp:Date.now()});
  s.auto.news=s.auto.news.slice(0,15);
};
const oldNextDay=nextDay;
nextDay=function(fromAuto=false){
  if(active())return oldNextDay();
  const before=s.day,seasonBefore=s.season;
  oldNextDay();
  if(hasSelected()){
    // Restore a little morale during non-league days, but do not erase friendly consequences immediately.
    if(before===5||before===6)for(const t of s.teams)changeMorale(t.id,2);
    if(s.season!==seasonBefore){s.pvp.attacks={};s.pvp.defDamage={};}
    s.auto.nextAt=Date.now()+V3_AUTO_MS;
    save();render();
    if(fromAuto&&before<5)notice(`${DAYS[before]}요일 정규 리그 10경기가 자동 종료됐습니다.`);
  }
};
const oldChooseClub=chooseClub;
chooseClub=function(id){
  if(hasSelected())return;
  initializeV3();oldChooseClub(id);initializeV3();
  // The new game starts on Monday and all future league rounds are CPU-vs-CPU.
  s.day=0;s.preseason=false;s.ui.calendarDay=0;
  s.auto.nextAt=Date.now()+V3_AUTO_MS;
  save();render();
  notice('구단이 배정됐습니다. 리그는 60초마다 한 게임일 자동 진행됩니다.');
};
function startAutoLeagueClock(){
  if(slEmbedded)return; // Shared server owns the only game clock.
  // Replaying missed ticks works only for this browser's local save; this is not a server scheduler.
  if(hasSelected())catchUpAutoClock();
  setInterval(()=>{
    if(hasSelected()&&!active()&&Date.now()>=s.auto.nextAt)catchUpAutoClock();
    const node=$('auto-countdown');
    if(node&&s.auto)node.textContent=`${Math.max(0,Math.ceil((s.auto.nextAt-Date.now())/1000))}초`;
  },800);
}
function catchUpAutoClock(){
  initializeV3();
  let steps=0;
  while(hasSelected()&&!active()&&Date.now()>=s.auto.nextAt&&steps<70){
    const scheduled=s.auto.nextAt;
    nextDay(true);
    s.auto.nextAt=scheduled+V3_AUTO_MS;
    steps++;
  }
  if(steps>=70)s.auto.nextAt=Date.now()+V3_AUTO_MS;
  if(steps){save();render();}
}
function friendDailyKey(){return `${s.season}:${s.day}:${s.selected}`}
function defenseDailyKey(id){return `${s.season}:${s.day}:${id}`}
function canFriendlyAttack(id){
  if(!hasSelected()||id===s.selected||!s.teams[id])return '상대 구단을 선택해 주세요.';
  if(active())return '진행 중인 경기가 끝나야 합니다.';
  if((s.pvp.attacks[friendDailyKey()]||0)>=V3_FRIENDLY_LIMIT)return '오늘 도전 가능 횟수를 모두 사용했습니다.';
  if(Date.now()<Number(s.pvp.cooldown[id]||0))return '같은 구단에 대한 재도전 대기시간이 남았습니다.';
  if(!validLineup(s.lineup))return '선발 5명을 먼저 완성해 주세요.';
  return '';
}
function instantFriendly(target){
  const error=canFriendlyAttack(target);if(error){notice(error);return;}
  const beforeA=teamMorale(s.selected),beforeB=teamMorale(target);
  const [my,op]=instant(s.selected,target);
  const win=my>op,loss=my<op;
  const ownChange=changeMorale(s.selected,win?6:loss?-12:-2);
  const capKey=defenseDailyKey(target),used=Number(s.pvp.defDamage[capKey]||0);
  let foeDelta=loss?6:win?-12:-2;
  if(foeDelta<0){foeDelta=-Math.min(-foeDelta,Math.max(0,V3_DEFENSE_LOSS_CAP-used));s.pvp.defDamage[capKey]=used+(-foeDelta)}
  const foeChange=changeMorale(target,foeDelta);
  s.pvp.attacks[friendDailyKey()]=(s.pvp.attacks[friendDailyKey()]||0)+1;
  s.pvp.cooldown[target]=Date.now()+V3_REPEAT_COOLDOWN_MS;
  s.pvp.history.unshift({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),season:s.season,day:s.day,attacker:s.selected,target,sa:my,sb:op,ownBefore:beforeA,ownAfter:ownChange.after,foeBefore:beforeB,foeAfter:foeChange.after,stamp:Date.now()});
  s.pvp.history=s.pvp.history.slice(0,120);
  // Friendly matches NEVER alter money or league standings.
  s.tab='friendly';save();render();
  notice(win?`친선 승리! ${s.teams[target].name} 사기 ${foeChange.change}`:loss?'친선 패배 · 우리 구단 사기 하락':'친선 무승부 · 양 팀 사기 소폭 하락');
}
function formatMoraleChange(before,after){const d=after-before;return `<span class="${d<0?'morale-danger':'morale-good'}">${d>0?'+':''}${d}</span>`}
function friendlyPage(){
  const target=Number(s.ui.friendlyTarget),other=s.teams.filter(t=>t.id!==s.selected),current=s.teams[target];
  const used=s.pvp.attacks[friendDailyKey()]||0,error=canFriendlyAttack(target),last=s.pvp.history[0];
  const lastResult=last?`<div class="match-result-box"><div class="small muted">가장 최근 도전 · ${new Date(last.stamp).toLocaleString('ko-KR')}</div><div class="big-score">${esc(s.teams[last.attacker].name)} ${last.sa} : ${last.sb} ${esc(s.teams[last.target].name)}</div><div class="small">도전자 사기 ${last.ownBefore} → ${last.ownAfter} (${formatMoraleChange(last.ownBefore,last.ownAfter)}) / 방어자 사기 ${last.foeBefore} → ${last.foeAfter} (${formatMoraleChange(last.foeBefore,last.foeAfter)})</div></div>`:'';
  return page('친선 도전전 · 오프라인 PvP','상대가 미접속이어도 저장된 선수와 전술로 즉시 자동 경기 · 패배 시 포인트 손실 없음',`<span class="tag">도전 ${used}/${V3_FRIENDLY_LIMIT}</span>`)
   +`<div class="friend-status"><div>우리 구단 사기<strong>${teamMorale(s.selected)}</strong>${moraleMeter(s.selected)}</div><div>선택 상대 사기<strong>${teamMorale(target)}</strong>${moraleMeter(target)}</div><div>남은 도전<strong>${V3_FRIENDLY_LIMIT-used}회</strong><span class="small muted">게임일 기준</span></div><div>리그 자동 진행<strong id="auto-countdown">—</strong><span class="small muted">데모 1분=1일</span></div></div>`
   +block('공격할 구단 지정',`<div class="challenge-pick"><select id="friendly-select" class="field">${other.map(t=>`<option value="${t.id}" ${t.id===target?'selected':''}>${esc(t.name)} (사기 ${teamMorale(t.id)} · 전력 ${power(t.id)})</option>`).join('')}</select><button class="btn primary" data-action="friendly-challenge" ${error?'disabled':''}>⚔ 친선 도전 · 즉시 판정</button></div><div class="spacer"></div><div class="small muted">선택 상대: <b>${esc(current.name)}</b> · 전력 ${power(target)} · 사기 ${moraleMeter(target)} | 등록된 5명·전술 자동 사용</div><div class="note ${error?'warn':''}" style="margin-top:9px">${error||'동일 구단 2분 재도전 제한 · 게임일당 5회 · 방어자 하루 최대 -24 사기 · 포인트 변동 없음'}</div>`)
   +(lastResult?block('최근 친선 결과',lastResult):'')
   +block('도전 이력',s.pvp.history.length?table(['게임일','공격 구단','방어 구단','스코어','공격자 사기','방어자 사기'],s.pvp.history.slice(0,20).map(h=>`<tr><td class="num">S${h.season} · ${DAYS[h.day]}</td><td>${esc(s.teams[h.attacker].name)}</td><td>${esc(s.teams[h.target].name)}</td><td class="strong num">${h.sa} : ${h.sb}</td><td class="num">${h.ownBefore} → ${h.ownAfter} (${formatMoraleChange(h.ownBefore,h.ownAfter)})</td><td class="num">${h.foeBefore} → ${h.foeAfter} (${formatMoraleChange(h.foeBefore,h.foeAfter)})</td></tr>`)):'<div class="empty">아직 친선 도전 이력이 없습니다.</div>')
   +block('친선전 규칙',`<div class="note">승리 사기 +6 · 패배 -12 · 무승부 -2. 사기 0~100, 기본 75. 동일 상대 2분 대기, 하루 최대 5회 도전. 방어자가 친선 공격으로 잃는 사기는 게임일당 최대 24. 리그 결과와 포인트는 변하지 않습니다.</div>`);
}

// V4.0: 14-day calendar, 19 full round-robin rounds, historical-age legend progression.
// Historical cards use 2005-07-01; active squads use 2026-11-22.
const V4_DAYS_PER_SEASON=14;
const V4_DATE_REFERENCE='2005-07-01';
function v4WeekName(day=s.day){return day<7?'상반기 · 1주차':'하반기 · 2주차'}
function v4IsLeagueDay(day){return day%7<5}
function v4GameDay(day){return day<7?day:day-2}
function playerAge(p){return p.ageBaseline+(s.season-1)}
function v4Progress(p,season){
 let ov=p.baseOvr, age=p.ageBaseline;
 for(let i=1;i<season;i++){
  const thisAge=age+i-1;
  let change=0;
  if(p.legend){
   if(thisAge<17)change=3;
   else if(thisAge<=20)change=4;
   else if(thisAge<=23)change=3;
   else if(thisAge<=26)change=2;
   else if(thisAge<=29)change=1;
   else if(thisAge<=32)change=0;
   else if(thisAge<=35)change=-1;
   else if(thisAge<=38)change=-2;
   else change=-3;
  }else{

  if(Math.random()>=V45_WEEKEND_WALKOUT)continue;
  const p=ply(id),oldName=s.teams[oldId].name;

  removeLegendFromTeam(id,oldId);

   const next=options[Math.floor(Math.random()*options.length)];
   next.roster.push(id);
   s.contracts[id]={teamId:next.id,signedSeason:s.season,endSeason:s.season+V45_CONTRACT_SEASONS-1,renewals:0};

  const before={season:s.season,day:s.day,morale:teamMorale(s.selected),contracts:Object.keys(s.contracts||{}).length,history:s.history.length};
  let completed=0;

  finally{v46BatchMode=false;}
  const newlyFinished=s.history.filter(h=>h.season>=before.season&&h.season<s.season).sort((a,b)=>a.season-b.season);
  s.v46Run={days:completed,startSeason:before.season,startDay:before.day,endSeason:s.season,endDay:s.day,beforeMorale:before.morale,afterMorale:teamMorale(s.selected),finished:newlyFinished,stamp:Date.now()};
  save();render();
  notice(`${completed}일 진행 완료 · 시즌 ${s.season} ${v4WeekName()} ${DAYS[s.day%7]}요일 · 사기 ${before.morale}→${teamMorale(s.selected)}`);

function v47BestLineup(tid){
 const team=s.teams[tid];if(!team)return [];
 if(tid===s.selected&&validLineup(s.lineup))return [...s.lineup];
 const picked=[];
 for(const role of ROLES){
  const options=team.roster.filter(id=>!picked.includes(id)&&ply(id)?.pos===role&&legendMood(ply(id),tid)!=='strike')
   .sort((a,b)=>(ply(b)?.ovr??0)-(ply(a)?.ovr??0));
  if(!options.length)return defaultLineup(team);
  picked.push(options[0]);
 }
 return picked;

function v47BalanceClubs(){
 if(v47BalancingDone)return;
 // Gameplay representation, not a claim about live club rankings.
 for(const team of CLUBS){
  const ids=team.roster.map(ply).filter(Boolean);
  const arr=[];for(const role of ROLES){
   const p=ids.filter(x=>x.pos===role&&!arr.includes(x)).sort((a,b)=>b.baseOvr-a.baseOvr)[0];
   if(p)arr.push(p);
  }
  const before=arr.reduce((x,p)=>x+p.baseOvr,0)/(arr.length||5);
  const delta=Math.round(V47_TARGET_POWER[team.id]-before);

const v47OldSimulateHalf=simulateHalf;
simulateHalf=function(home,away,th,ta,half){

 const advantage=((a.att-b.def)*.62+(a.def-b.att)*.38);
 const variation=(Math.random()-.5)*7;

 const homePossession=clamp(.505+gap*.010,.30,.70);
 const events=[];
 for(let min=1;min<=20;min++){
  let evt=[];
  if(Math.random()<.39){
   const side=Math.random()<homePossession?'home':'away';
   const sideGap=side==='home'?gap:-gap;
   const conversion=clamp(.185+sideGap*.0065,.065,.31);
   const goal=Math.random()<conversion;
   evt=[{side,kind:goal?'goal':'shot',min:(half-1)*20+min,player:ply(scorer(side==='home'?home:away))?.name||''}];
  }else if(Math.random()<.075){evt=[{side:Math.random()<homePossession?'home':'away',kind:'press',min:(half-1)*20+min,player:''}];}
  events.push(evt);
 }

};

const v411PreviousTick=tick;
tick=function(){
 const m=s.match;if(m?.kind!=='friendly-pvp')return v411PreviousTick();
 if(!['first','second'].includes(m.phase)){halt();return;}
 const reel=v411Reel(m),sec=clamp((Date.now()-m.segmentStart)/1000,0,60);
 const phaseKey=`${m.phase}/${m.segmentStart}`;
 if(m.v411ProcessedPhase!==phaseKey){m.v411ProcessedPhase=phaseKey;m.v411Seen={};}
 let changes=false;
 const existing=new Set((m.events||[]).map(v411EventKey));
 for(const scheduled of reel.scheduled){
  if(scheduled.at>sec+.015)break;
  if(m.v411Seen[scheduled.key])continue;
  m.v411Seen[scheduled.key]=true;
  const e=scheduled.ev;
  if(existing.has(scheduled.key))continue;
  m.events.push(e);if(m.events.length>80)m.events.shift();
  if(e.kind==='goal'||e.kind==='shot'){if(e.side==='home')m.shotsHome++;else m.shotsAway++;}
  if(e.kind==='goal'){if(e.side==='home')m.hs++;else m.as++;}
  if(e.kind==='injury'&&e.playerId)v49Injure(e.playerId,'친선경기');
  if(e.kind!=='press')m.lastFlash=`${e.min}분 · ${e.player||'선수'} ${e.kind==='goal'?'득점':e.kind==='injury'?'부상':'슛'}`;
  existing.add(scheduled.key);changes=true;
 }
 m.halfMin=Math.min(20,Math.floor(sec/3));
 if(sec>=59.99){
  // Drain all remaining real events (e.g. a background tab woke at full time).
  for(const scheduled of reel.scheduled){
   if(m.v411Seen[scheduled.key])continue;
   m.v411Seen[scheduled.key]=true;
   const e=scheduled.ev;if(existing.has(scheduled.key))continue;
   m.events.push(e);if(m.events.length>80)m.events.shift();
   if(e.kind==='goal'||e.kind==='shot'){if(e.side==='home')m.shotsHome++;else m.shotsAway++;}
   if(e.kind==='goal'){if(e.side==='home')m.hs++;else m.as++;}
   if(e.kind==='injury'&&e.playerId)v49Injure(e.playerId,'친선경기');
   existing.add(scheduled.key);
  }
  halt();m.halfMin=20;
  if(m.phase==='first'){m.phase='halftime';m.lastFlash='전반 하이라이트 종료 · 하프타임 선수 교체 및 전술 변경';}
  else{m.phase='finished';v47CompleteFriendly(m);}
  save();render();return;
 }
 if(changes)save();
 renderTick();
};

 if(!s.pvp.teamRestUntil||typeof s.pvp.teamRestUntil!=='object')s.pvp.teamRestUntil={};
 const now=Date.now();
 for(const [club,until] of Object.entries(s.pvp.teamRestUntil)){
  const old=Number(until)||0;
  const revised=Math.min(old,Math.max(now,old-2*60*1000));

 notice('공용 리그는 서버에서 60초마다 함께 진행됩니다. 테스트용 강제 1일 진행은 운영자 계정만 가능합니다.');
};
const slRecruitOffline=recruit;
recruit=function(id){if(!slEmbedded)return slRecruitOffline(id);slCommand('fa_sign',{player:id});};
const slReleaseOffline=release;
release=function(id){if(!slEmbedded)return slReleaseOffline(id);slCommand('release',{player:id});};
const slResetOffline=resetGame;
resetGame=function(...args){if(!slEmbedded)return slResetOffline(...args);notice('공용 구단 소유권은 초기화 버튼으로 삭제되지 않습니다.');};
const slBeginMatchOffline=beginMatch;
beginMatch=function(kind){if(!slEmbedded)return slBeginMatchOffline(kind);
 if(kind==='league'){notice('온라인 정규리그는 서버에서 자동 집계됩니다. 개인 PC의 로컬 중계로 공용 경기 결과를 덮어쓸 수 없습니다.');return;}
 notice('이 친선경기는 로컬 연습 경기입니다. 공용 뉴스·순위에 기록되지 않습니다.');return slBeginMatchOffline(kind);
};
const slFriendlyOffline=instantFriendly;
instantFriendly=function(id){if(slEmbedded)notice('친선 도전은 로컬 연습이며 공용 순위 및 뉴스에는 반영되지 않습니다.');return slFriendlyOffline(id);};
const slTransferOffline=transferPage;
transferPage=function(){
 if(!slEmbedded)return slTransferOffline();
 const offerList=sl.snapshot?.offers||[];
 const available=(sl.snapshot?.players||[]).filter(p=>ply(p.id)?.legend && p.club!==null && p.club!==s.selected);
 const cpuEligible=(p)=>{const owner=sl.snapshot.clubs[p.club];return !!owner.manager||p.endSeason-s.season<=0||owner.morale<50;};
 const current=available.filter(cpuEligible);
 const selected=s.ui.slTargetPlayer||current[0]?.id;
 const item=current.find(x=>x.id===selected)||current[0];
 const seller=item?sl.snapshot.clubs[item.club]:null;
 const min=seller&&item?(seller.morale<50?Math.floor(item.price*.78):Math.floor(item.price*.95)):0;
 const options=current.map(p=>`<option value="${esc(p.id)}" ${p.id===item?.id?'selected':''}>${esc(ply(p.id)?.name)} · ${esc(s.teams[p.club]?.name)}${!sl.snapshot.clubs[p.club].manager?' (CPU)':''}</option>`).join('');
 const mineOffers=offerList.filter(o=>o.buyer===s.selected||o.createdBy===sl.snapshot?.viewer?.id);
 const incoming=offerList.filter(o=>o.seller===s.selected&&o.status==='proposed');
 const statusName={proposed:'감독 응답 대기',accepted:'수락 · 주말 확정 대기',rejected:'거절',cancelled:'철회',completed:'이적 오피셜',failed:'무산 · 환불'};
 return page('실시간 구단 간 이적시장',`온라인 레전드 이적 · 모든 제안과 수락은 Supabase에 반영 · 현재 구단 예산 ${fmt(s.points)}P`)
 +block('레전드 이적 제안',`${sl.offerFeedback?`<div class="note ${sl.offerFeedback.type==='error'?'warn':''}" id="sl-offer-feedback" role="status"><b>최근 제안 상태:</b> ${esc(sl.offerFeedback.message)}</div><div class="spacer"></div>`:''}${sl.offerAttempt?`<button class="btn xs" type="button" data-action="sl-offer-check">거래 상태 재확인</button><div class="spacer"></div>`:''}<div class="note">선수 계약 제안은 언제든 가능하며, <b>완전 이적은 주말에만 확정</b>됩니다. CPU는 잔여 계약 1시즌 이하이거나 사기가 50 미만일 때 판매합니다.</div><div class="spacer"></div>
 <div class="v412-form-grid"><label><span>영입할 선수</span><select id="sl-transfer-player" class="field" data-change="sl-player">${options||'<option value="">현재 협상할 수 있는 레전드 없음</option>'}</select></label>
 <label><span>제안 이적료 (P)</span><input class="field" id="sl-transfer-amount" type="number" min="0" max="1000000" step="10" value="${item?Math.max(min,Math.min(item.price,s.points)):0}"></label></div>
 ${item?`<div class="small muted">판매 구단: ${esc(seller.name)} · 감독: ${esc(seller.manager||'CPU')} · 계약 잔여 ${Math.max(0,item.endSeason-s.season+1)}시즌${!seller.manager?` · CPU 예상 최저 ${fmt(min)}P`:''}</div>`:''}
 <div class="spacer"></div><button class="btn primary" data-action="sl-submit" ${!item||sl.busy?'disabled':''}>공식 이적 제안</button>`)
 +block(`내게 도착한 제안 (${incoming.length})`,incoming.length?incoming.map(o=>`<div class="v412-deal"><b>${esc(ply(o.player)?.name)} · ${fmt(o.amount)}P</b><span class="small">${esc(s.teams[o.buyer].name)}에서 영입 제안</span><button class="btn xs primary" data-action="sl-respond" data-id="${o.id}" data-value="accept">수락</button><button class="btn xs" data-action="sl-respond" data-id="${o.id}" data-value="reject">거절</button></div>`).join(''):'<div class="empty">새로운 제안이 없습니다.</div>')
 +block(`내가 보낸 제안 (${mineOffers.length})`,mineOffers.length?mineOffers.slice(0,40).map(o=>`<div class="v412-deal"><b>${esc(ply(o.player)?.name)} → ${esc(s.teams[o.buyer]?.name)} · ${fmt(o.amount)}P</b><span class="tag">${statusName[o.status]||o.status}</span>${['proposed','accepted'].includes(o.status)?`<button class="btn xs" data-action="sl-cancel" data-id="${o.id}">제안 철회</button>`:''}</div>`).join(''):'<div class="empty">아직 제출한 제안이 없습니다.</div>');
};
const slNewsOffline=newsPage;
newsPage=function(){
 if(!slEmbedded)return slNewsOffline();
 const items=sl.snapshot?.news||[];
 const classify=n=>n.kind==='system'&&n.details?.source==='user_post'?'user':n.kind;
 const filter=s.ui.newsFilter||'all';
 const filtered=filter==='all'?items:items.filter(n=>classify(n)===filter);
 const choices=[['all','전체'],['user','유저 소식'],['league','리그 결과'],['transfer','이적 제안'],['official','이적 오피셜'],['system','구단 소식']];
 const compose=filter==='all'||filter==='user'?`<div class="sl-user-compose"><div class="line between"><b>유저 소식 · 채팅</b><span class="small muted">감독 ${esc(sl.snapshot?.viewer?.nickname||'')} · 1~180자</span></div><div class="sl-compose-row"><input id="sl-user-news-input" type="text" class="field" maxlength="180" autocomplete="off" placeholder="리그에 소식을 남겨 보세요. 운영자: /사기 닉네임 100"><button class="btn primary" type="button" data-action="sl-post-news" ${sl.busy?'disabled':''}>전송</button></div><div class="small muted">모든 감독에게 공유됩니다. 서버 동기화는 약 15초 간격이며, 글을 쓰면 즉시 새로고침됩니다.</div></div>`:'';
 const labels={user:'유저 소식',league:'리그 결과',official:'이적 오피셜',transfer:'이적 제안',system:'구단 소식'};
 const cards=filtered.map(n=>{
  const kind=classify(n);
  const isUser=kind==='user';
  const author=isUser?esc(n.details?.author||'유저'):'';
  const headline=isUser?esc(n.details?.body||n.title):esc(n.title);
  const time=n.at?new Date(n.at).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  return `<article class="v415-story ${isUser?'sl-user-story':''}" data-kind="${esc(kind)}"><div class="v415-story-top"><span class="tag ${isUser?'blue':''}">${labels[kind]||'소식'}</span><span class="small muted">시즌 ${n.season} · ${DAYS[n.day%7]}요일${time?' · '+esc(time):''}</span></div>${isUser?`<div class="sl-user-author">${author}</div>`:''}<div class="v415-headline">${headline}</div>${n.kind==='league'&&Array.isArray(n.details)?`<details class="v415-details"><summary>전체 경기 스코어</summary><div class="v415-match-list">${n.details.map(m=>`<div>${esc(s.teams[m.a]?.name)} ${m.sa}:${m.sb} ${esc(s.teams[m.b]?.name)}</div>`).join('')}</div></details>`:''}</article>`;
 }).join('')||'<div class="empty">서버에 기록된 뉴스가 아직 없습니다.</div>';
 return page('슈퍼리그 공용 뉴스','같은 리그의 모든 감독에게 동일하게 공유되는 경기·이적·유저 소식')
 +block('공용 뉴스 및 유저 소식',`<div class="v415-filterline">${choices.map(([k,v])=>`<button class="btn xs ${filter===k?'active':''}" data-action="v415-filter" data-value="${k}">${v}</button>`).join('')}<button class="btn xs" data-action="sl-retry">새로고침</button></div>${compose}<div class="v415-feed">${cards}</div>`);
};
const slDashOffline=dash;
dash=function(){if(!slEmbedded)return slDashOffline();
 return slDashOffline().replace('데모에서는 브라우저에만 상태를 저장합니다. 여러 이용자 간 실제 중복 영입 방지는 추후 서버 DB가 필요합니다.','구단 소유권·선수 영입·포인트·순위·뉴스는 Supabase 서버에서 공동 관리합니다. 리그 경기는 서버가 자동 집계합니다.')
 +`<div class="note">서버 로그인: <b>${esc(sl.snapshot?.viewer?.nickname||'미확인')}</b> · 계정 구분 ID: ${esc(String(sl.snapshot?.viewer?.id||'').slice(0,8))} · 온라인 공용 리그 · 다른 감독과 같은 구단·레전드·이적 기록을 공유합니다. 다음 갱신까지 ${sl.snapshot?.nextAt?Math.max(0,Math.ceil((new Date(sl.snapshot.nextAt).getTime()-Date.now())/1000)):60}초 · 자동 갱신 15초 간격</div>`;
};
const slClubListOffline=clubList;
clubList=function(){if(!slEmbedded)return slClubListOffline();
 return slClubListOffline().replace('내 구단 감독 정보','온라인 구단 감독 정보');
};
const slRenderOffline=render;
render=function(){
 if(slEmbedded&&!sl.ready){
  $('screen').innerHTML='<div class="empty">'+esc(sl.error||'온라인 리그 서버에 연결하고 있습니다.')+'</div>';
  $('chooser').innerHTML=renderChooser();return;
 }
 slRenderOffline();
 if(slEmbedded){
  const footer=document.querySelector('#screen .footer');
  if(footer)footer.innerHTML='공용 온라인 리그 · 구단·선수·이적·리그 기록은 Supabase 서버 기준 · 친선 연습/경기 중계는 로컬 실행 · 엑셀 포인트와 구단 예산은 별도입니다.';
 }
};
document.addEventListener('click',e=>{
 if(!slEmbedded)return;
 const b=e.target.closest?.('[data-action]');if(!b)return;
 if(b.dataset.action==='sl-retry'){e.preventDefault();slLoad();}
 if(b.dataset.action==='sl-offer-check'){e.preventDefault();void slOfferCheck();}
 if(b.dataset.action==='tab'&&b.dataset.value==='transfer'&&sl.ready){setTimeout(()=>{void slOfferCheck();},100);}
 if(b.dataset.action==='sl-post-news'){
  e.preventDefault();
  const input=$('sl-user-news-input');const text=String(input?.value||'').trim();
  if(!text)return notice('유저 소식 내용을 입력하세요.');
  if(text.length>180)return notice('메시지는 180자 이하만 가능합니다.');
  slCommand('post',{text}).then(ok=>{if(ok&&$('sl-user-news-input'))$('sl-user-news-input').value='';});
 }
 if(b.dataset.action==='sl-submit'){
  e.preventDefault();
  const player=$('sl-transfer-player')?.value,amount=Number($('sl-transfer-amount')?.value);
  if(!player||!Number.isSafeInteger(amount)||amount<0||amount>1000000)return notice('선수와 0~1,000,000P 사이 정수 금액을 확인하세요.');
  if(sl.busy)return notice('서버에서 이전 요청을 처리하고 있습니다.');
  // Preserve the same idempotency request on an unresolved matching submission.
  const previous=sl.offerAttempt;
  const sameUnconfirmed=previous&&previous.player===player&&previous.amount===amount&&sl.offerFeedback?.type==='warn';
  const request=sameUnconfirmed?previous.request:crypto.randomUUID();
  void slCommand('offer',{request,player,amount});
 }
 if(b.dataset.action==='sl-respond')slCommand('respond',{id:b.dataset.id,decision:b.dataset.value});
 if(b.dataset.action==='sl-cancel')slCommand('cancel',{id:b.dataset.id});
},true);
document.addEventListener('keydown',e=>{
 if(!slEmbedded||e.target?.id!=='sl-user-news-input'||e.key!=='Enter'||e.isComposing)return;
 e.preventDefault();document.querySelector('[data-action="sl-post-news"]')?.click();
});
document.addEventListener('change',e=>{
 if(!slEmbedded)return;
 if(e.target?.id==='sl-transfer-player'){
  s.ui.slTargetPlayer=e.target.value;render();
 }
});
window.addEventListener('message',e=>{
 if(!slEmbedded||e.origin!==location.origin||e.source!==window.parent)return;
 if(e.data?.type==='SL_RPC_RESULT'){
  const request=sl.pending.get(e.data.requestId);if(!request)return;
  sl.pending.delete(e.data.requestId);clearTimeout(request.timer);
  if(e.data.ok)request.resolve(e.data.data);else request.reject(new Error(e.data.error||'서버 오류'));
 }
 if(e.data?.type==='EXCEL_SUPERLEAGUE_IDENTITY'&&e.data.online){
   sl.adminResetAvailable=Boolean(e.data.adminResetAvailable);
   const resetButton=document.getElementById('sl-season-reset-btn');
   if(resetButton)resetButton.hidden=!sl.adminResetAvailable;
   const offlineReset=document.getElementById('sl-offline-reset');
   if(offlineReset)offlineReset.hidden=true;
  const nick=String(e.data.nickname||'').trim().slice(0,16);
  if(nick)window.__excelManagerNickname=nick;
  if(!sl.poll){slLoad();sl.poll=setInterval(()=>{if(document.visibilityState==='visible')slLoad(true);},15000);}
 }
});
if(slEmbedded)render();


// V4.22 · shared online season reset. Authorization is verified in Supabase.
if(slEmbedded){
 const localOnly=document.getElementById('sl-offline-reset');
 if(localOnly)localOnly.hidden=true;
 const resetButton=document.getElementById('sl-season-reset-btn');
 if(resetButton){
  resetButton.hidden=true;
  resetButton.addEventListener('click',async()=>{
   if(resetButton.disabled||!sl.adminResetAvailable)return;
   if(!window.confirm('공용 슈퍼리그의 경기·이적·뉴스 기록을 모두 초기화하고 시즌 1 첫날로 되돌릴까요? 현재 구단 감독 배정은 유지하며, 개인 게임 포인트에는 영향이 없습니다.'))return;
   if(!window.confirm('최종 확인: 전체 슈퍼리그 이용자에게 즉시 반영됩니다. 계속할까요?'))return;
   resetButton.disabled=true;
   try{
    const result=await slRequest('sl_admin_reset',{p_confirm:'RESET_SEASON_1'});
    if(!result?.ok)throw new Error(result?.error||'리셋 요청이 거부됐습니다.');
    try{if(sl.snapshot?.viewer?.id)sessionStorage.removeItem('sl_offer_attempt_'+sl.snapshot.viewer.id);}catch(_e){}
    sl.offerAttempt=null;
    sl.offerFeedback=null;
    s=initial();
    const loaded=await slLoad(false);
    if(!loaded)throw new Error('초기화는 성공했으나 서버 상태를 다시 불러오지 못했습니다. 다시 접속해 주세요.');
    notice('슈퍼리그 시즌 1 · 첫날로 초기화했습니다. 리셋 전 서버 백업 번호: '+result.backupId);
   }catch(error){notice('리셋 실패/상태 재확인 필요: '+String(error?.message||error));}
   finally{resetButton.disabled=false;}
  });
 }
}
</script></body></html>
