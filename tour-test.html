<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>슈퍼리그 해외투어 테스트</title><style>
:root{color-scheme:light dark;--green:#217346;--bg:#f5f8f6;--panel:#fff;--ink:#24382c;--muted:#607568;--line:#d4e0d7;--red:#b23b3b} @media(prefers-color-scheme:dark){:root{--bg:#131a16;--panel:#202923;--ink:#e5ede7;--muted:#a3b6a9;--line:#3a4d40;--red:#ff8e8e}}
*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}h1{font-size:23px;margin:0 0 5px}h2{font-size:18px;margin:0}p{margin:6px 0}.muted{color:var(--muted);font-size:12px}.warning{padding:10px 12px;border:1px solid #b89446;background:#c7a65a16;margin:12px 0}.layout{display:grid;grid-template-columns:repeat(2,minmax(270px,1fr));gap:12px;min-width:552px}.wrap{overflow-x:auto}.panel{border:1px solid var(--line);background:var(--panel);min-width:0}.heading{background:var(--green);color:#fff;padding:12px}.body{padding:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin:10px 0}.meta div{background:var(--panel);padding:8px}.meta small{display:block;color:var(--muted)}.match{border-bottom:1px solid var(--line);padding:9px 0}.match .title{font-weight:650;margin-bottom:5px}.buttons{display:flex;gap:6px}button,select{font:inherit;color:var(--ink);border:1px solid var(--line);background:var(--panel);padding:8px 10px;border-radius:3px}button{cursor:pointer}button.active,button.primary{background:var(--green);border-color:var(--green);color:white}button:disabled{opacity:.45;cursor:not-allowed}.buttons button{flex:1}.action{display:flex;gap:6px;margin:12px 0}.action button{flex:1}.summary{padding:10px;background:#2173460c;border:1px solid var(--line);margin-top:12px}.summary b{font-size:17px;color:var(--green)}@media(prefers-color-scheme:dark){.summary b{color:#72d6a3}}.row{display:flex;justify-content:space-between;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}.good{color:#269b65;font-weight:700}.bad{color:var(--red);font-weight:700}.status{font-weight:650;color:var(--muted);margin-top:8px}.result{margin-top:10px;border:1px solid var(--line);padding:9px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.testbox{border:1px dashed var(--line);padding:8px;margin:10px 0}.testbox summary{cursor:pointer}.big{font-size:19px;font-weight:700}.error{min-height:20px;color:var(--red);font-size:12px}.participants{min-height:110px}.footer{margin-top:14px}
</style></head><body><h1>해외투어</h1><div class="muted">동남아 · 유럽 슈퍼투어 / 독립 쿨타임 5분</div><div class="warning"><b>격리 테스트 모드</b> · 가상 포인트와 가상 참가자만 사용합니다. 실제 회원 포인트·사기·리그 기록은 변경하지 않습니다.</div><div class="controls"><label for="club">테스트 구단</label><select id="club"><option value="0">레알 마드리드</option><option value="1">FC 바르셀로나</option><option value="2">맨체스터 시티</option></select><span class="muted" id="notice" role="status"></span></div><div class="wrap"><div class="layout"><section class="panel" id="asia"></section><section class="panel" id="europe"></section></div></div><details class="testbox"><summary>QA 전용 설정 (실서비스에는 미노출)</summary><div class="controls"><label for="scenarioA">동남아 결과</label><select id="scenarioA"><option value="random">정상 확률</option><option value="hit">전부 적중</option><option value="miss">한 경기 실패</option><option value="noshow">2경기 노쇼</option></select><label for="scenarioE">유럽 결과</label><select id="scenarioE"><option value="random">정상 확률</option><option value="hit">내 예측 전부 적중</option><option value="miss">내 예측 실패</option><option value="noshow">내 구단 노쇼</option><option value="other">다른 구단 노쇼</option></select></div><div class="controls"><button id="reset">테스트 초기화</button><button id="low">참가비만 보유한 상태로 초기화</button><button id="skip">쿨타임 테스트 해제</button></div><p class="muted">초기화는 브라우저 테스트 데이터에만 적용. 유럽의 나머지 2팀은 테스트 버튼으로 준비시킵니다.</p></details><p class="footer muted">테스트 모드에서는 브라우저 저장소를 사용합니다. 서버 인증·다른 기기 간 동시 참가·실제 포인트 정산은 연결하지 않았습니다.</p><script>
const KEY='sl-tour-isolated-test-v1',FEE={asia:30,europe:300},UNIT={asia:10,europe:100},WIN={asia:.9,europe:.8},NO={asia:.01,europe:.05},CLUBS=[{name:'레알 마드리드',player:'호날두'},{name:'FC 바르셀로나',player:'메시'},{name:'맨체스터 시티',player:'케빈 더 브라위너'}],OPP=['싱가포르 XI','방콕 유나이티드','하노이 FC'];
const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('ko-KR')+'억 P',sign=n=>(n>0?'+':'')+fmt(n),pred=x=>x==='W'?'승':x==='L'?'패':'미선택',profit=(type,choices)=>choices.reduce((a,x)=>a+(x==='W'?2:x==='L'?10:0)*UNIT[type],0);
const rng=()=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296;
const fresh=(low=false)=>({version:1,wallet:CLUBS.map(()=>low?300:1000),morale:[100,100,100],pick:{asia:[null,null,null],europe:[null,null,null]},lobby:[],runs:{asia:null,europe:null},cool:{asia:[0,0,0],europe:[0,0,0]},club:0,lowAsia:low});
let state;try{state=JSON.parse(localStorage.getItem(KEY));if(!state||state.version!==1)state=fresh();}catch(e){state=fresh();}
let error={asia:'',europe:''};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
if(state.lowAsia){state.wallet[state.club]=30;state.lowAsia=false;save();}
function now(){return Date.now()}
function setError(type,msg){error[type]=msg;paint()}
function running(type){return !!state.runs[type]&&!state.runs[type].settled}
function seconds(ms){const n=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function begin(type,members,scenario){
 const t=now(),fee=FEE[type],need=type==='europe'?3:1;
 if(running(type)||members.length!==need||new Set(members.map(m=>m.club)).size!==need||members.some(m=>!m.ready||m.choices.length!==3||m.choices.some(c=>!['W','L'].includes(c))||state.wallet[m.club]<fee||state.cool[type][m.club]>t))return setError(type,'참가 조건을 충족하지 않습니다. 참가비·준비·쿨타임을 확인하세요.');
 members.forEach(m=>state.wallet[m.club]-=fee);
 const launch=t+(type==='europe'?3000:0),matches=[];
 for(let i=0;i<3;i++){
  const club=type==='europe'?members[i].club:members[0].club;
  let ns=scenario==='random'&&rng()<NO[type];
  if(scenario==='noshow')ns=type==='europe'?club===state.club:i===1;
  if(scenario==='other')ns=type==='europe'&&club!==state.club&&i===members.findIndex(m=>m.club!==state.club);
  const chosen=members.find(m=>m.club===state.club)?.choices[i]||members[0].choices[i];
  const actual=ns?'N':scenario==='hit'?chosen:scenario==='miss'?(i===1?(chosen==='W'?'L':'W'):chosen):rng()<WIN[type]?'W':'L';
  matches.push({club,actual,revealAt:launch+2000*(i+1)});
  if(ns){for(let j=i+1;j<3;j++)matches.push({club:type==='europe'?members[j].club:club,actual:'C',revealAt:launch+2000*(i+1)});break;}
 }
 const finishAt=matches.find(m=>m.actual==='N')?.revealAt||launch+6000;
 state.runs[type]={id:crypto.randomUUID(),members:JSON.parse(JSON.stringify(members)),matches,launch,finishAt,settled:false,receipts:[]};
 if(type==='europe')state.lobby=[];
 error[type]='';save();paint();
}
function settle(type,t){
 const r=state.runs[type];if(!r||r.settled||t<r.finishAt)return;
 const fee=FEE[type],no=r.matches.find(m=>m.actual==='N'),receipts=[];
 for(const m of r.members){
  let gain=0,penalty=0,net=-fee,hit=false,charge=0;
  if(no){
   if(m.club===no.club){penalty=type==='asia'?30:600;charge=Math.min(penalty,state.wallet[m.club]);state.wallet[m.club]-=charge;state.morale[m.club]=Math.max(0,state.morale[m.club]-10);net=-fee-charge;}
   else{gain=fee;net=0;}
  }else if(m.choices.every((v,i)=>v===r.matches[i].actual)){hit=true;gain=fee+profit(type,m.choices);net=gain-fee;}
  state.wallet[m.club]+=gain;state.cool[type][m.club]=r.finishAt+300000;
  receipts.push({club:m.club,net,gain,charge,penalty,hit,morale:no&&no.club===m.club?-10:0});
 }
 r.receipts=receipts;r.settled=true;save();
}
function tick(){const t=now();settle('asia',t);settle('europe',t);paint()}
function addMine(){if(running('europe')||state.cool.europe[state.club]>now())return setError('europe','유럽 쿨타임 또는 진행 중입니다.');if(state.wallet[state.club]<300)return setError('europe','참가비 300억이 부족합니다.');if(!state.lobby.some(x=>x.club===state.club))state.lobby.push({club:state.club,ready:false,choices:[...state.pick.europe]});save();paint()}
function prepare(){if(state.pick.europe.some(x=>!x))return setError('europe','3경기의 승패를 모두 선택하세요.');addMine();const m=state.lobby.find(x=>x.club===state.club);if(!m)return;m.ready=true;m.choices=[...state.pick.europe];save();maybeStart();paint()}
function maybeStart(){if(state.lobby.length===3&&state.lobby.every(x=>x.ready))begin('europe',state.lobby,$('scenarioE').value)}
function fill(){if(running('europe'))return;for(let c=0;c<3;c++){if(c===state.club||state.lobby.some(x=>x.club===c))continue;if(state.wallet[c]<300||state.cool.europe[c]>now())continue;state.lobby.push({club:c,ready:true,choices:Array.from({length:3},()=>rng()<.8?'W':'L')})}save();maybeStart();paint()}
function results(type){const r=state.runs[type];if(!r)return '';const t=now(),member=r.members.find(m=>m.club===state.club);if(!member)return '';if(t<r.launch)return '<div class="result big">출발까지 '+Math.ceil((r.launch-t)/1000)+'초</div>';
 const rows=r.matches.map((m,i)=>{const label=type==='europe'?CLUBS[m.club].name:OPP[i];if(t<m.revealAt)return '<div class="row"><span>'+(i+1)+'경기 · '+label+'</span><span class="muted">노쇼 여부 확인 중…</span></div>';if(m.actual==='N')return '<div class="row bad"><span>'+(i+1)+'경기 · '+label+'</span><b>노쇼</b></div><div class="bad">'+CLUBS[m.club].name+' '+CLUBS[m.club].player+' 선수가 노쇼했습니다.</div>';if(m.actual==='C')return '<div class="row"><span>'+(i+1)+'경기 · '+label+'</span><span>취소</span></div>';let hit=member.choices[i]===m.actual;return '<div class="row"><span>'+(i+1)+'경기 · '+label+'<br><small>예측 '+pred(member.choices[i])+' / 실제 '+pred(m.actual)+'</small></span><span class="'+(hit?'good':'bad')+'">'+(hit?'적중 · '+fmt((m.actual==='W'?2:10)*UNIT[type]):'실패')+'</span></div>'}).join('');
 let receipt='';if(r.settled){const no=r.matches.find(m=>m.actual==='N'),me=r.receipts.find(x=>x.club===state.club);receipt='<p class="big '+(me.net>0?'good':me.net<0?'bad':'')+'">'+(no?'투어 무효':me.hit?'3경기 전부 적중!':'예측 실패')+' · '+sign(me.net)+'</p><div class="row"><span>총 수령액</span><b>'+fmt(me.gain)+'</b></div>';
 if(no)receipt+=r.receipts.map(x=>'<div class="row"><span>'+CLUBS[x.club].name+(x.morale?' · 사기 -10':' · 참가비 반환')+'</span><b class="'+(x.net<0?'bad':'')+'">'+sign(x.net)+'</b></div>').join('')+(me.penalty?'<small>위약금 '+fmt(me.penalty)+' / 실제 차감 '+fmt(me.charge)+' (잔액 부족 시 0원)</small>':'');
 }else receipt='<p class="muted">경기별 배당은 최종 판정 전까지 지급되지 않습니다.</p>';
 return '<div class="result"><b>투어 결과</b>'+rows+receipt+'</div>';
}
function panel(type){
 const euro=type==='europe',pick=state.pick[type],busy=running(type),me=state.lobby.find(x=>x.club===state.club),locked=busy||(euro&&me?.ready),remain=Math.max(0,state.cool[type][state.club]-now()),complete=pick.every(Boolean);
 const title=euro?'유럽 슈퍼투어':'동남아 투어';
 const inputs=pick.map((v,i)=>'<div class="match"><div class="title">'+(i+1)+'경기</div><div class="buttons">'+['W','L'].map(x=>'<button data-pick="'+type+':'+i+':'+x+'" class="'+(v===x?'active':'')+'" '+(locked?'disabled':'')+'>'+pred(x)+' ×'+(x==='W'?2:10)+'</button>').join('')+'</div></div>').join('');
 const lobby=euro?'<div class="participants"><b>참가팀 '+(busy?3:state.lobby.length)+'/3</b>'+((busy?state.runs.europe.members:state.lobby).map(m=>'<div class="row"><span>'+CLUBS[m.club].name+(m.club===state.club?' (나)':'')+'</span><span class="'+(m.ready?'good':'muted')+'">'+(m.ready?'준비 완료':'대기')+'</span></div>').join('')||'<div class="muted">참가팀 없음</div>')+'</div>':'';
 const actions=euro?'<div class="action"><button class="primary" data-act="prepare" '+(locked||!complete||remain?'disabled':'')+'>준비 완료</button><button data-act="cancel" '+(!me||busy?'disabled':'')+'>참가 취소</button></div><div class="action"><button data-act="join" '+(me||busy||remain?'disabled':'')+'>참가하기</button><button data-act="fill" '+(busy?'disabled':'')+'>테스트 참가팀 준비</button></div>':'<div class="action"><button class="primary" data-act="asia" '+(busy||remain||!complete?'disabled':'')+'>30억 걸고 시작</button></div>';
 return '<div class="heading"><h2>'+title+'</h2><div>'+(euro?'3팀 준비 시 자동 진행':'혼자 즉시 진행')+'</div></div><div class="body"><div class="meta"><div><small>경기당 참가비</small><b>'+fmt(UNIT[type])+'</b></div><div><small>총참가비</small><b>'+fmt(FEE[type])+'</b></div><div><small>경기당 승률</small><b>'+(WIN[type]*100)+'%</b></div><div><small>경기당 노쇼 확률</small><b>'+(NO[type]*100)+'%</b></div></div>'+lobby+inputs+'<div class="summary">선택: '+pick.map(pred).join(' / ')+'<br>전부 적중 순수익 <b>'+(complete?sign(profit(type,pick)):'—')+'</b></div>'+actions+'<div class="status">'+(busy?'투어 진행 중':remain?'다음 이용까지 '+seconds(remain):'다음 이용까지 00:00')+'</div><div class="error">'+error[type]+'</div>'+results(type)+'</div>';
}
function paint(){$('asia').innerHTML=panel('asia');$('europe').innerHTML=panel('europe');$('club').value=String(state.club);$('club').disabled=running('asia')||running('europe')||state.lobby.length>0}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const p=b.dataset.pick;if(p){const [type,i,v]=p.split(':');if(running(type)||(type==='europe'&&state.lobby.some(x=>x.club===state.club&&x.ready)))return;state.pick[type][Number(i)]=v;const m=state.lobby.find(x=>x.club===state.club);if(type==='europe'&&m)m.choices=[...state.pick.europe];error[type]='';save();paint();return}
 const act=b.dataset.act;if(act==='asia')begin('asia',[{club:state.club,ready:true,choices:state.pick.asia}],$('scenarioA').value);
 if(act==='join')addMine();if(act==='prepare')prepare();if(act==='fill')fill();if(act==='cancel'&&!running('europe')){state.lobby=state.lobby.filter(x=>x.club!==state.club);error.europe='';save();paint()}});
$('club').onchange=e=>{state.club=Number(e.target.value);state.pick={asia:[null,null,null],europe:[null,null,null]};save();paint()};
$('reset').onclick=()=>{if(confirm('테스트 상태만 초기화할까요?')){state=fresh();error={asia:'',europe:''};save();paint()}};
$('low').onclick=()=>{if(confirm('테스트 상태를 초기화하고 동남아는 30억, 유럽 테스트는 별도 초기화 후 300억 조건으로 검증할까요?')){state=fresh(true);state.wallet[0]=$('scenarioE').value==='random'?30:300;state.lowAsia=false;error={asia:'',europe:''};save();paint()}};
$('skip').onclick=()=>{if(!running('asia')&&!running('europe')){state.cool={asia:[0,0,0],europe:[0,0,0]};save();paint()}};
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=JSON.parse(e.newValue);tick()}catch(_){}}});
tick();setInterval(tick,1000);
</script></body></html>
