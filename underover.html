   else html+=`<div class="notice">${d.my_side_selected?'예측 확정 완료 · 상대방 선택 대기':'비공개 선택 대기 중'}</div>`;
 }else if(d.phase==='choose2'){
   html+='<div class="notice">1차 베팅 종료로 목표 숫자가 공개됐습니다. 두 번째 주사위를 각자 1~6 중 직접 고르세요. <b>2차 주사위는 본인 것만 확인할 수 있고 상대에게는 최종 정산까지 비공개</b>입니다. 첫 주사위는 이미 양쪽에 공개되어 있습니다. 예측(언더·오버·타겟)도 최종 정산까지 비공개로 유지됩니다.</div>';
   if(me>0&&!d.my_die2_selected)html+=`<div class="choice-row">${[1,2,3,4,5,6].map(n=>`<button class="die option" data-die2="${n}" aria-label="비공개 주사위 ${n} 선택">${faces[n]}</button>`).join('')}</div>`;
   else html+=`<div class="notice">${d.my_die2_selected?('두 번째 내 주사위 '+(d.my_die2?faces[d.my_die2]+' ('+d.my_die2+') · ':'')+'상대방 대기'):'주사위 선택 대기 중'}</div>`;
 }else if(d.phase==='finished'){
   let who='',hit=r.hits||[],payouts=r.payouts||[],isCarry=r.type==='carry',isShow=r.type==='showdown'||isCarry;
   if(isShow){
     if(isCarry)who='둘 다 실패 · 판돈 이월!';
     else if(hit[0]&&hit[1])who='두 사람 모두 적중';
     else if(hit[0])who=esc(seatOf(1).name)+' 단독 적중';
     else if(hit[1])who=esc(seatOf(2).name)+' 단독 적중';
     else who='두 사람 모두 실패 · 묻고 더블!';
   }else who=r.type==='carry_cancelled'?'이월 종료 · 예치 원금 반환':r.type==='timeout_cancel'?'시간 초과 · 원금 반환':r.winner===1?esc(seatOf(1).name)+' 승리':r.winner===2?esc(seatOf(2).name)+' 승리':'라운드 종료';
   html+=`<div class="result"><b>${who}</b><div>${isShow?'주사위 합계 '+fmt(r.total)+' / 목표 '+fmt(r.target):r.type==='fold'?'폴드':r.type==='forfeit'?'기권':r.type==='timeout'?'상대방 시간 초과':'게임 취소'}</div>`;
   if(isShow)html+=`<div>1차 주사위: ${players[0].die1} + ${players[1].die1} · 2차 주사위: ${d.die2?.join(' + ')}</div><div>1P ${sideText(players[0].side)} / 2P ${sideText(players[1].side)}</div><div class="uo-payouts"><span>1P 지급: <b>${fmt(payouts[0]||0)}P</b></span><span>2P 지급: <b>${fmt(payouts[1]||0)}P</b></span></div><div class="note">추가 보너스 ${fmt(Math.max(0,r.bonus||0))}P · 혼자 언더·오버 적중: 총 팟 100% · 혼자 타겟 적중: 내 누적 베팅금 10배 · 둘 다 언더·오버 적중: 총 팟 각 50% · 둘 다 타겟 적중: 각자 누적 베팅금 2배</div>`;
   html+=`<div>총 판돈 ${fmt(r.pot||d.pot)}P</div></div>${isCarry?`<div class="notice"><b>묻고 더블!</b> ${fmt(d.pot)}P는 그대로 이월됩니다. 다음 판 각자 시작 예치금 <b>${fmt(d.next_ante)}P</b>. 두 사람이 다시 준비하면 이어서 진행합니다. 대결을 끝내면 각각 실제로 걸었던 원금을 돌려받습니다.</div>`:'<div class="note">재대결하려면 양쪽 모두 다시 준비해 주세요.</div>'}<div class="flex">${me?`<button data-act="ready" class="button">${p.ready?'준비 취소':'재대결 준비'}</button>`:''}${me===1?`<button data-act="start" class="button primary" ${!(players[0].ready&&players[1].ready)?'disabled':''}>${isCarry?'묻고 더블 시작':'재대결 시작'}</button>`:''}${isCarry&&me?'<button data-act="cancel_rollover" class="button danger">대결 종료 · 원금 반환</button>':''}</div>`;
 }
 html+='</div>';
 html+=`<div class="uo-rules-grid"><b>베팅 정산표 · 목표 숫자 ${goal??'1차 합 + 6~8 (비공개)'}</b><div>혼자 언더·오버 적중 <strong>총 팟 100%</strong></div><div>혼자 타겟 적중 <strong>내 베팅금 10배</strong></div><div>둘 다 언더·오버 적중 <strong>각 팟 50%</strong></div><div>둘 다 타겟 적중 <strong>각자 베팅금 2배</strong></div><small>베팅금은 기본 예치금을 포함한 누적 금액이며, 지급 배수는 원금을 포함합니다. 둘 다 실패하면 판돈 이월 + 다음 판 시작 예치금 2배. 진행 단계별 30초 제한.</small></div>`;
 if(!me)html+='<div class="notice">관전 중 · 1차 주사위는 두 선수의 선택이 끝나면 볼 수 있습니다. 2차 주사위와 언더·오버·타겟 예측은 최종 정산 때 공개됩니다. 베팅에는 참가할 수 없지만 채팅은 가능해요.</div>';
 $('root').innerHTML=html;
 $('invite').onclick=()=>{const parentUrl=new URL(location.origin+location.pathname.replace(/underover\.html$/,'index.html'));parentUrl.searchParams.set('room',d.room);navigator.clipboard?.writeText(parentUrl.href).then(()=>feedback('초대 링크 복사 완료')).catch(()=>feedback('링크: '+parentUrl.href));};
 const takeSeat=$('takeSeat');if(takeSeat)takeSeat.onclick=()=>act('join');
 $('leave').onclick=()=>{if(me===0){act('leave');return;}if(d.phase==='waiting'||d.phase==='finished'||confirm('진행 중에 나가면 기권으로 처리되고 판돈을 상대에게 지급합니다. 나가시겠습니까?'))act('leave');};
 $('root').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
 $('root').querySelectorAll('[data-die]').forEach(b=>b.onclick=()=>act('die',b.dataset.die));
 $('root').querySelectorAll('[data-die2]').forEach(b=>b.onclick=()=>act('die2',b.dataset.die2));
 $('root').querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>act('side',b.dataset.side));
 $('root').querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{
   const cmd=b.dataset.bet,n=cmd==='raise'?Number($('raiseAmount')?.value):null;
   if(cmd==='raise'&&(!Number.isSafeInteger(n)||n<1))return feedback('레이즈 총액을 정수로 입력해 주세요.',true);
   act('bet',cmd,n);
 });
}
function urlRoom(id,watch=false){if(room!==id)resetSocial();room=id;watchMode=watch;const u=new URL(location.href);u.searchParams.set('room',id);if(watch)u.searchParams.set('watch','1');else u.searchParams.delete('watch');history.replaceState(null,'',u.pathname+u.search);}
async function join(id,watch=false){if(!/^u-[0-9a-f]{12}$/.test(id))return feedback('올바른 언더오버 방 코드를 입력해 주세요.',true);urlRoom(id,watch);await act(watch?'watch':'join')}
async function act(action,choice=null,amount=null){if(busy)return;busy=true;
 try{if(!(await ensureCredentials())){feedback('회원 정보를 불러오지 못했습니다. Sheet1에서 로그인 상태를 확인한 뒤 다시 열어 주세요.',true);return;}
 if(action==='leave'&&data?.my_seat===0){try{await socialRpc('leave')}catch(_){}room='';data=null;watchMode=false;history.replaceState(null,'',location.pathname);resetSocial();render();feedback('관전을 종료했습니다.');setTimeout(refresh,0);return;}
 let next;
 if(action==='watch')next=await rpc('sync');
 else if(action==='join'){
  try{next=await rpc('join',choice,amount)}
  catch(err){
   // 정원 2명인 방은 관전 모드로 입장합니다. 게임 함수는 수정하지 않습니다.
   if(!/이미 2명이 참가|이미.*참가 중|정원/.test(err.message))throw err;
   next=await rpc('sync');
   if(next.my_seat!==0)throw err;
   watchMode=true;const url=new URL(location.href);url.searchParams.set('watch','1');history.replaceState(null,'',url.pathname+url.search);
  }
 }else next=await rpc(action,choice,amount);
 if(action==='create'){urlRoom(next.created_room);} if(action==='leave'){try{await socialRpc('leave')}catch(_){}room='';data=null;history.replaceState(null,'',location.pathname);resetSocial();feedback('방에서 나왔습니다.');render();setTimeout(refresh,0);return;}
 data=next;wallet=next.my_balance??wallet;chosenDie=0;feedback((next.my_seat===0?'관전 입장 완료 · ':'서버 처리 완료 · ')+humanPhase(next.phase));render();setTimeout(syncSocial,0);}
 catch(e){feedback('요청 실패: '+e.message,true);if(action==='join'){room='';data=null;history.replaceState(null,'',location.pathname);render();}}
 finally{busy=false;}
}
async function refresh(){if(busy||polling||!uoIsVisible())return;polling=true;try{
 if(room){if(!(await ensureCredentials())){feedback('회원 로그인 정보가 없습니다. Sheet1에서 로그인한 후 다시 열어 주세요.',true);return;}let d=await rpc('sync');if(!data||Number(d.revision)>Number(data.revision)){data=d;wallet=d.my_balance??wallet;render();}else{if(d.my_balance!==undefined&&d.my_balance!==wallet){wallet=d.my_balance;data.my_balance=d.my_balance;render();}else updateClock();}}
 else{const response=await rpc('list');lobby=response.rooms||[];render();}}
 catch(e){feedback('동기화 실패: '+e.message,true);if(!room)renderLobby();}finally{polling=false;}}
if(room&&!/^u-[0-9a-f]{12}$/.test(room))room='';
if(!room){renderLobby();refresh()}else{act(watchMode?'watch':'join')}setInterval(()=>{if(uoIsVisible())refresh()},1500);setInterval(()=>{if(uoIsVisible())syncSocial()},3000);setInterval(updateClock,400);window.addEventListener('focus',()=>{if(uoIsVisible()){refresh();syncSocial();}});
</script></body></html>
